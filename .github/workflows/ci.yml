name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The Pages build installs on Node 18 with npm 9, which refuses a peer conflict that newer npm only
  # warns about. That difference is how a broken deploy passed every local check, so the deploy's own
  # install runs first here.
  install-as-deploy:
    name: install as Pages does
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci

  verify:
    name: types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
